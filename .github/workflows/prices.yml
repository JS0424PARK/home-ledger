name: Update prices
on:
  schedule:
    - cron: '30 7 * * *'   # 16:30 KST daily
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prices
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/fetch-prices.mjs
      - name: Commit
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet || (git commit -m "prices $(date -u +%F)" && git push)
